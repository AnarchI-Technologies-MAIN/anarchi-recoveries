services:
  recoveries-test-object-store:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: recoveries_local_proof
      MINIO_ROOT_PASSWORD: recoveries-local-proof-only
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
