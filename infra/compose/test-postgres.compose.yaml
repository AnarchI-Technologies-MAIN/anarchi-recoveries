services:
  recoveries-test-postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: recoveries_test
      POSTGRES_USER: recoveries_test_owner
      POSTGRES_PASSWORD: ${RECOVERIES_TEST_DB_PASSWORD:?required for isolated database tests}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveries_test_owner -d recoveries_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
