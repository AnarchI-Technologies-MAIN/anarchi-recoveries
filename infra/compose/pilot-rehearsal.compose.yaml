services:
  recoveries-pilot-postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    environment:
      POSTGRES_DB: recoveries_pilot
      POSTGRES_USER: recoveries_pilot_owner
      POSTGRES_PASSWORD: ${RECOVERIES_PILOT_DB_PASSWORD:?required for isolated pilot rehearsal}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    networks:
      - pilot-rehearsal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveries_pilot_owner -d recoveries_pilot"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  recoveries-pilot-nats:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:54223:4222"
      - "127.0.0.1:58223:8222"
    tmpfs:
      - /data:rw,noexec,nosuid,size=256m
    networks:
      - pilot-rehearsal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  recoveries-pilot-object-store:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: ${RECOVERIES_PILOT_OBJECT_STORE_ACCESS_KEY:?required for isolated pilot rehearsal}
      MINIO_ROOT_PASSWORD: ${RECOVERIES_PILOT_OBJECT_STORE_SECRET_KEY:?required for isolated pilot rehearsal}
    ports:
      - "127.0.0.1:59002:9000"
      - "127.0.0.1:59003:9001"
    tmpfs:
      - /data:rw,noexec,nosuid,size=512m
    networks:
      - pilot-rehearsal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  recoveries-pilot-zitadel-postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel_pilot
      POSTGRES_PASSWORD: ${RECOVERIES_PILOT_ZITADEL_DB_PASSWORD:?required for isolated pilot rehearsal}
    networks:
      - pilot-rehearsal
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel_pilot -d zitadel"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  recoveries-pilot-zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.2@sha256:4b68a2106f60baa2895e5a00a77fcd915d29d0db3f0c011d3eb9f99f557b2b48
    command: start-from-init --masterkey "${RECOVERIES_PILOT_ZITADEL_MASTERKEY:?must be exactly 32 characters}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: 127.0.0.1
      ZITADEL_EXTERNALPORT: 58081
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel_pilot:${RECOVERIES_PILOT_ZITADEL_DB_PASSWORD:?required for isolated pilot rehearsal}@recoveries-pilot-zitadel-postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: false
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: true
    ports:
      - "127.0.0.1:58081:8080"
    networks:
      - pilot-rehearsal
    depends_on:
      recoveries-pilot-zitadel-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    restart: "no"

networks:
  pilot-rehearsal:
    name: recoveries-pilot-rehearsal
    internal: true
