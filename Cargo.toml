[workspace]
members = [
  "crates/recovery-model",
  "crates/recovery-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.98"

[workspace.dependencies]
hex = "0.4.3"
rust_decimal = { version = "1.37.2", features = ["serde-str"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"

